name: Deploy Airport Maps

on:
  workflow_run:
    workflows: ["Build JSON from .alist"]
    types:
      - completed
  workflow_dispatch: {}

concurrency:
  group: deploy-airport-maps-master
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'master')
      || (github.event_name == 'workflow_dispatch'
        && (github.actor == 'mapcat' || github.actor == 'jteresco'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo (master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pycountry

      - name: Download OurAirports CSV
        run: |
          curl -L -o ourairports.csv \
            https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv

      - name: Enrich airports.csv
        run: python air/scripts/enrich_airports.py

      - name: Run build_data.py
        run: python air/scripts/build_data.py

      - name: Commit updated airports.csv and unknown_codes.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add air/data/airports.csv air/data/unknown_codes.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-enriched airports.csv and updated unknown_codes.txt"
          git pull --rebase origin master
          git push origin HEAD:master

      # If you're using Pages via Actions, keep these deploy steps.
      # If your repo uses "Deploy from a branch", these steps are harmless but not required.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
