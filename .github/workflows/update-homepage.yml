name: Update Homepage Data

on:
  workflow_run:
    workflows: ["Build JSON from .alist"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && (github.actor == 'mapcat' || github.actor == 'jteresco'))
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run homepage data generator
        run: |
          cd air/scripts
          python generate_homepage_data.py

      - name: Commit and push changes if homepage data changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add air/data/homepage_data.json

          if git diff --cached --quiet; then
            echo "No homepage data changes to commit."
            exit 0
          fi

          git commit -m "Automated homepage statistics update [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
