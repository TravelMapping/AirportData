# Triggering a fresh automation run
name: Update Homepage Data

on:
  push:
    branches:
      - master # Triggers automation whenever code is pushed to master
  pull_request:
    branches:
      - master # Triggers automation whenever a pull request is merged
  workflow_dispatch: # Adds the manual "Run workflow" button to the GitHub UI

jobs:
  build:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && (github.actor == 'mapcat' || github.actor == 'jteresco'))
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run homepage data generator
        run: |
          cd air/scripts
          python generate_homepage_data.py

      - name: Commit and push changes
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add air/data/homepage_data.json
          
          # Only commit if the python script actually changed the statistics
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated homepage statistics update [skip ci]"
            git pull origin master --rebase
            git push origin HEAD:master
          fi
